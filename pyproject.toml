[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-enrichment"
version = "0.1.0"
description = "Autonomous lead enrichment agent: crawl public sites, evidence-lock LLM extracts, score confidence in code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Surya" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "google-genai>=1.0",
  "markdownify>=0.13",
  "playwright>=1.49",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.scripts]
lead-enrichment = "lead_enrichment.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
